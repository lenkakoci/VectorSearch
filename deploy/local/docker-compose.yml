# Explicit project name. Without it Compose derives the name from the parent
# directory ("local"), which collides with any other project laid out the same
# way and makes Compose recycle that project's containers.
name: vectorsearch

services:
  postgres:
    build:
      context: ../../postgres
    image: vectorsearch/postgres:17-pgvector
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Bind mount so report data survives container recreation.
      # Never remove this directory without explicit approval - it holds real documents.
      - ./data/postgres:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Search API for the web demo. Reads credentials (PGPASSWORD, GEMINI_API_KEY)
  # from data/scripts/.env; the host name is overridden to reach the postgres
  # service inside the compose network.
  api:
    build:
      context: ../../data/scripts
      dockerfile: Dockerfile.api
    image: vectorsearch/api:0.1
    env_file:
      - ../../data/scripts/.env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
    ports:
      # Loopback only: the reports are internal and the API has no authentication.
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The React page, served by nginx, which proxies /api to the api service.
  frontend:
    build:
      context: ../../frontend
    image: vectorsearch/frontend:0.1
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - api
    restart: unless-stopped
