server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/..., nginx forwards it to the
    # FastAPI container named "api" in docker-compose.
    location /api/ {
        proxy_pass http://api:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An answer grades 40 candidates and then writes the text, which is
        # usually 10-30 s but has been seen over two minutes when Gemini is
        # slow. The proxy must outlast that, or the page shows a 504 for an
        # answer the API went on to produce.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
