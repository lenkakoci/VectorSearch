[project]
name = "geo-report-scripts"
version = "0.1.0"
description = "Extraction, chunking, embedding and import pipeline for digital geological reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Google Gemini: structured extraction and embeddings
    "google-genai>=2.19.0",
    "pandas>=2.3.1",
    "python-dotenv>=1.1.1",
    "pydantic>=2.0.0",
    "pyarrow>=18.0.0",
    "tenacity>=9.0.0",
    "psycopg2-binary>=2.9.0",
    "numpy>=1.24.0",
    # PDF text extraction, page by page. One engine feeds both the Markdown and
    # the page map - see the module docstring in extract_reports.py for why.
    "pdfminer.six>=20240706",
    # Local, offline token counting used only to size chunks. Not Gemini's
    # tokenizer, so counts are approximate - see chunker.py.
    "tiktoken>=0.8.0",
]
